name: Update version table

# Regenerates the README version table from versions.json on every push, so the
# columned box (serial / version / changes / download) stays current by itself.
on:
  push:
    branches: [main]
    paths:
      - versions.json
      - scripts/render_versions.py
      - .github/workflows/readme-versions.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render README version table
        run: python scripts/render_versions.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: refresh version table [skip ci]"
            git push
          else
            echo "No change."
          fi
